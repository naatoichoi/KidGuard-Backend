name: phamngocanh
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [private]
  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Proxy__KnownAddress: 172.29.0.10
      ConnectionStrings__DefaultConnection: "Server=db;Database=KidGuard;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      Jwt__Issuer: ${API_DOMAIN:?Set API_DOMAIN}
      Jwt__Audience: phamngocanh-mobile
      Jwt__ExpireMinutes: "120"
      Smtp__Host: ${SMTP_HOST:?Set SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Email: ${SMTP_EMAIL:?Set SMTP_EMAIL}
      Smtp__Password: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
    networks: [private]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      private:
        ipv4_address: 172.29.0.10
networks:
  private:
    ipam:
      config:
        - subnet: 172.29.0.0/24
volumes:
  sql_data:
  caddy_data:
  caddy_config:
